name: Update grants

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape NWO grants
        run: python scraper.py

      - name: Process into grants.json
        run: python process.py

      - name: Convert HTML to Markdown
        run: python html_to_md.py

      - name: Scrape NWO news feed
        run: python news_scrape.py

      # Precompute the digest artifacts here, so the weekly Cowork task only ever
      # fetches DATA. It is not allowed to download and execute digest.py at
      # run time: the sandbox classifier refuses that as "Code from External".
      # candidates.json = the weekly delta; currently_open.json = all open calls,
      # for an automatic first-send backfill to new subscribers (changelog §11).
      - name: Precompute digest candidates + currently-open set
        run: |
          python digest.py candidates --days 21 --local > candidates.json
          python digest.py candidates --days 21 --local --backfill > currently_open.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grants.json grants_list.json news.json candidates.json currently_open.json md/
          if git diff --staged --quiet; then
            echo "No changes — data is up to date."
          else
            # Touch requirements.txt so Streamlit Cloud detects the commit and redeploys
            touch requirements.txt
            git add requirements.txt
            git commit -m "Auto-update grants + news + candidates ($(date -u +%Y-%m-%d))"
            git push
          fi
